name: 每日自动爬取时政与招聘公告

# 触发条件：每天早上 7:00（北京时间）自动执行 + 支持手动触发
on:
  schedule:
    # UTC 23:00 = 北京时间 07:00
    - cron: '0 23 * * *'
  workflow_dispatch:  # 允许在 GitHub 网页手动触发

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许推送到仓库

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install requests beautifulsoup4 lxml

      - name: 爬取每日时政
        run: |
          python shizheng_crawler.py
        env:
          SHIZHENG_OUTPUT: shizheng.json

      - name: 爬取招聘公告
        run: |
          python crawler.py
        env:
          CRAWLER_OUTPUT: data.json

      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shizheng.json data.json
          git diff --staged --quiet || git commit -m "自动更新：时政与招聘公告 $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M')"
          git push

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: true
